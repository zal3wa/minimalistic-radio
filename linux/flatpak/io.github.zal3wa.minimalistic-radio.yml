id: io.github.zal3wa.minimalistic-radio
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: minimalistic-radio
# The translations stay in the app: a .flatpak bundle has no room for a separate Locale extension.
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The tray icon. MPRIS needs nothing: Flatpak lets every app own org.mpris.MediaPlayer2.<app id>.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Stop before the computer sleeps (PrepareForSleep).
  - --system-talk-name=org.freedesktop.login1
modules:
  - name: minimalistic-radio
    buildsystem: meson
    sources:
      # linux/, the Meson project.
      - type: dir
        path: ..
        skip:
          - .venv
