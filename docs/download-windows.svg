  <g fill="#fff">
    <rect x="16" y="16" width="11" height="11"/>
    <rect x="29" y="16" width="11" height="11"/>
    <rect x="16" y="29" width="11" height="11"/>
    <rect x="29" y="29" width="11" height="11"/>
  </g>
  <g fill="#fff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text x="53" y="24" font-size="11">Download for</text>
    <text x="52" y="43" font-size="21" font-weight="600">Windows</text>
  </g>
</svg>
