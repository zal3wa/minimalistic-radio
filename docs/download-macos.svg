<svg xmlns="http://www.w3.org/2000/svg" width="168" height="56" viewBox="0 0 168 56">
  <!-- "Download for macOS" button in the style of the App Store / Google Play badges. -->
  <rect x="0.5" y="0.5" width="167" height="55" rx="9" fill="#000" stroke="#a6a6a6"/>
  <!-- A plain laptop, drawn here: no third-party logo. -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="17.5" y="16.5" width="22" height="16" rx="2"/>
    <path d="M13 37.5h31"/>
  </g>
  <g fill="#fff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text x="53" y="24" font-size="11">Download for</text>
    <text x="52" y="43" font-size="21" font-weight="600">macOS</text>
  </g>
</svg>
