name: macOS

# The Mac app (macos/): core tests, a universal build, checks of the built app, and a DMG.
# The development PC is Windows, so this is where the Mac app is built and tested.
on:
  push:
    branches: ['**']
    tags: ['macos-v*']
    paths: ['macos/**', '.github/workflows/macos.yml', 'data/banned-stations.json']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml', 'data/banned-stations.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP: build/Build/Products/Release/Minimalistic Radio.app
      TAG: ${{ startsWith(github.ref, 'refs/tags/macos-v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          brew install xcodegen librsvg
          xcodebuild -version

      - name: Core tests
        run: swift test --package-path macos/Core

      - name: Generate the Xcode project
        run: cd macos && xcodegen generate

      - name: Build (universal)
        run: |
          xcodebuild -project macos/MinimalisticRadio.xcodeproj -scheme MinimalisticRadio -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- \
            MR_RELEASE_TAG="${TAG:-dev}" build > build.log 2>&1 || { grep -E "error:" build.log | head -n 60; tail -n 40 build.log; exit 1; }
          grep -E "warning: " build.log | sort -u | head -n 40 || true

      - name: Check the app
        run: |
          binary="$APP/Contents/MacOS/Minimalistic Radio"
          archs=$(lipo -archs "$binary"); echo "architectures: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal"; exit 1 ;; esac
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$APP/Contents/Info.plist")" = true
          test -f "$APP/Contents/Resources/banned-stations.json"
          size=$(du -sk "$APP" | cut -f1); echo "app size: ${size} KB"; test "$size" -lt 10240
          "$binary" --self-test

      - name: DMG
        run: |
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Minimalistic Radio" -srcfolder dmg -ov -format UDZO Minimalistic-Radio.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Minimalistic-Radio-dmg
          path: Minimalistic-Radio.dmg
