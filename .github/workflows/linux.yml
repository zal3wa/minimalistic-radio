name: Linux

on:
  push:
    branches: ['**']
    tags: ['linux-v*']
    paths: ['linux/**', '.github/workflows/linux.yml', 'data/banned-stations.json']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rehearse, e.g. linux-v1.0.0-beta.1 (only used with dry_run)'
        required: false
        type: string
      dry_run:
        description: 'Run the release checks and print the commands, without publishing anything'
        required: false
        type: boolean
        default: false
      publish_repo:
        description: 'Run on main: sign this build into the Flatpak repository on GitHub Pages and check it (no GitHub release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Does the gnome content snap used by the snapcraft gnome extension ship gst-libav?
  snap-gnome-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install the gnome content snap (core26)
        run: sudo snap install gnome-core26

      - name: Look for libgstlibav.so
        run: |
          found=$(find /snap/gnome-core26/current -name libgstlibav.so)
          echo "libgstlibav.so: ${found:-none}"
          if [ -z "$found" ]; then
            echo "AAC: stage gst-libav in the snap" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Pure-Python unit tests (core/, controller.py): no GTK needed.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run the unit tests
        run: cd linux && python -m pytest -q

  # GStreamer playback against a local test server, on the distribution's PyGObject.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install PyGObject, GTK, libadwaita and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-tools gir1.2-gdkpixbuf-2.0 librsvg2-common xvfb dbus-x11 gettext meson desktop-file-utils appstream

      # fdkaacenc makes the HE-AAC test stream. Without it that one case is skipped.
      - name: Install the HE-AAC encoder
        run: sudo apt-get install -y gstreamer1.0-fdkaac || echo "gstreamer1.0-fdkaac is not available"

      - name: List the GStreamer elements the tests rely on
        run: |
          for element in playbin souphttpsrc icydemux pulsesink pipewiresink fakesink lamemp3enc avenc_aac aacparse fdkaacenc opusenc oggmux avdec_aac fdkaacdec; do
            if gst-inspect-1.0 --exists "$element"; then echo "$element: yes"; else echo "$element: no"; fi
          done

      - name: Run the integration tests
        run: cd linux && dbus-run-session -- xvfb-run -a python3 -m pytest tests/integration -q -rs

      - name: Build with Meson and run its checks
        run: |
          meson setup _build linux --prefix "$PWD/_installed"
          meson compile -C _build
          meson test -C _build --print-errorlogs

      # The installed app (as in the Flatpak and the Snap) must have every module: a missing one only fails at run time.
      - name: Install, and check the installed app
        run: |
          meson install -C _build
          package=$(dirname "$(find _installed -path '*/minimalistic_radio/main.py')")
          (cd "$package/.." && find minimalistic_radio -name '*.py' | sort) > installed.txt
          (cd linux && git ls-files 'minimalistic_radio/*.py' | sort) > expected.txt
          diff -u expected.txt installed.txt
          dbus-run-session -- xvfb-run -a _installed/bin/minimalistic-radio --self-test

      # Pictures of the window for review (the owner has no Linux). Never fails the job.
      - name: Take the screenshots
        continue-on-error: true
        run: |
          cd linux
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" python3 -m minimalistic_radio.main --screenshot ../linux-screenshots
          # The installed app has the compiled catalogs: German and Ukrainian show whether the longer words fit.
          for lang in de uk; do
            LANGUAGE=$lang dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" "$PWD/../_installed/bin/minimalistic-radio" --screenshot ../linux-screenshots/$lang
          done

      # linux-screenshots, for the metainfo, comes from the Flatpak job.
      - name: Upload the screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots-ubuntu
          path: linux-screenshots/
          if-no-files-found: ignore

  # The Flatpak: built as Flathub would, checked by Flathub's linter, and run in its sandbox.
  # Each check runs whenever the build worked, so one failure does not hide the others.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      MANIFEST: linux/flatpak/io.github.zal3wa.minimalistic-radio.yml
    steps:
      - uses: actions/checkout@v7

      # Branch stable, as in the published repository. This bundle is only for the checks below: the bundle in a
      # release is made by the repo job, from the signed repository.
      - name: Build
        id: build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: linux/flatpak/io.github.zal3wa.minimalistic-radio.yml
          branch: stable
          bundle: minimalistic-radio.flatpak
          artifact-name: flatpak-ci-bundle

      # The unsigned build, for the repo job to sign. Only when that job runs (see its condition).
      - name: Pack the build for signing
        if: >-
          (startsWith(github.ref, 'refs/tags/linux-v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish_repo || inputs.dry_run))
        run: tar -C repo -cf flatpak-build-repo.tar .

      - name: Upload the build for signing
        if: >-
          (startsWith(github.ref, 'refs/tags/linux-v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish_repo || inputs.dry_run))
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-build-repo
          path: flatpak-build-repo.tar
          retention-days: 3
          if-no-files-found: error

      # Errors that only this repository's build has (raw output first, then the verdict):
      # - appstream-external-screenshot-url, appstream-screenshots-not-mirrored-in-ostree: Flathub's
      #   build mirrors the screenshots; this one keeps the GitHub URLs, which a .flatpak from a release can show.
      # - appstream-missing-screenshots: only while the screenshots are not on main yet.
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          allowed='"appstream-external-screenshot-url", "appstream-screenshots-not-mirrored-in-ostree"'
          if ! curl -sfI https://raw.githubusercontent.com/zal3wa/minimalistic-radio/main/docs/screenshots/linux-stations-light.png > /dev/null; then
            echo "::warning::The screenshots are not on main yet."
            allowed="$allowed, \"appstream-missing-screenshots\""
          fi
          echo "{\"io.github.zal3wa.minimalistic-radio\": [$allowed]}" > /tmp/lint-exceptions.json
          flatpak-builder-lint manifest "$MANIFEST" || true
          flatpak-builder-lint repo repo || true
          flatpak-builder-lint --exceptions --user-exceptions /tmp/lint-exceptions.json manifest "$MANIFEST"
          flatpak-builder-lint --exceptions --user-exceptions /tmp/lint-exceptions.json repo repo

      # The bundle installed as a user installs it, then run with its own permissions on the GNOME Platform.
      # (flatpak-builder --run can't work in this container: it starts rofiles-fuse through a host portal.)
      - name: Install the bundle
        id: install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: flatpak install --user --noninteractive --assumeyes --bundle minimalistic-radio.flatpak

      - name: Self-test in the sandbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a flatpak run io.github.zal3wa.minimalistic-radio --self-test

      - name: Take the screenshots in the sandbox
        id: shots
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$PWD/linux-screenshots"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" flatpak run --filesystem="$PWD/linux-screenshots" \
            io.github.zal3wa.minimalistic-radio --screenshot "$PWD/linux-screenshots"

      - name: Upload the screenshots
        if: ${{ !cancelled() && steps.shots.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots
          path: linux-screenshots/

      - name: HE-AAC check in the sandbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # Exit 2 means the network or the station was inconclusive: retry once. Exit 1 fails at once.
          run_check() {
            dbus-run-session -- xvfb-run -a flatpak run --command=python3 io.github.zal3wa.minimalistic-radio \
              /app/share/minimalistic-radio/check_aac.py
          }
          code=0; run_check || code=$?
          if [ "$code" = 2 ]; then echo "Inconclusive (exit 2), retrying once"; sleep 20; code=0; run_check || code=$?; fi
          exit "$code"

      # The player tests on the runtime's GStreamer, for information only (--devel: the SDK, which has pip).
      - name: Player tests in the sandbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          dbus-run-session -- xvfb-run -a flatpak run --devel --filesystem="$PWD" --command=sh io.github.zal3wa.minimalistic-radio \
            -c "python3 -m pip install --quiet --target /tmp/pytest pytest && cd '$PWD/linux' && PYTHONPATH=/tmp/pytest python3 -m pytest tests/integration/test_player.py -q -rs -p no:cacheprovider"

  # The Snap, as Ubuntu's App Center installs it: built by snapcraft, installed, and run strictly confined.
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        id: build
        uses: snapcore/action-build@v1
        with:
          path: linux

      - name: Name the artifact
        id: artifact
        run: echo "name=$(basename '${{ steps.build.outputs.snap }}')" >> "$GITHUB_OUTPUT"

      - name: Upload the snap
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      # snap run puts the app in a systemd scope, so it needs the user's own systemd and its session bus (a
      # dbus-run-session bus has no systemd behind it): the runner user gets a lingering session.
      - name: Install the snap
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-user-session
          sudo loginctl enable-linger "$(id -un)"
          bus="/run/user/$(id -u)/bus"
          for second in $(seq 30); do [ -S "$bus" ] && break; sleep 1; done
          test -S "$bus"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$bus" >> "$GITHUB_ENV"
          sudo snap install --dangerous '${{ steps.build.outputs.snap }}'
          sudo snap connect minimalistic-radio:login-session-observe
          snap connections minimalistic-radio

      - name: Self-test in the snap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: xvfb-run -a snap run minimalistic-radio --self-test

      # The decoders the snap gets from the GNOME platform (MP3, Opus, Vorbis, FLAC), the ICY titles, HTTP and the
      # sound output, as the app's own GStreamer sees them inside the snap. AAC and HLS are played below.
      - name: GStreamer elements in the snap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          snap run --shell minimalistic-radio -c 'python3 -' <<'EOF'
          import sys
          import gi
          gi.require_version("Gst", "1.0")
          from gi.repository import Gst
          Gst.init(None)
          # Each line: what it is for, then the elements that can do it (any one is enough).
          needed = [
              ("HTTP", ["souphttpsrc"]),
              ("ICY titles", ["icydemux"]),
              ("playback", ["playbin"]),
              ("MP3 parser", ["mpegaudioparse"]),
              ("MP3 decoder", ["mpg123audiodec", "avdec_mp3"]),
              ("Ogg", ["oggdemux"]),
              ("Opus", ["opusdec"]),
              ("Vorbis", ["vorbisdec"]),
              ("FLAC parser", ["flacparse"]),
              ("FLAC decoder", ["flacdec"]),
              ("sound output", ["pulsesink", "pipewiresink"]),
          ]
          missing = []
          for purpose, names in needed:
              found = [n for n in names if Gst.ElementFactory.find(n) is not None]
              if found:
                  plugin = Gst.ElementFactory.find(found[0]).get_plugin()
                  print(f"{purpose}: {found[0]} ({plugin.get_filename() if plugin else '?'})")
              else:
                  print(f"{purpose}: MISSING ({' or '.join(names)})")
                  missing.append(purpose)
          if missing:
              print("::error::Missing in the snap: " + ", ".join(missing))
              sys.exit(1)
          EOF

      - name: HE-AAC check in the snap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # Exit 2 means the network or the station was inconclusive: retry once. Exit 1 fails at once.
          run_check() { snap run --shell minimalistic-radio -c 'python3 $SNAP/usr/share/minimalistic-radio/check_aac.py'; }
          code=0; run_check || code=$?
          if [ "$code" = 2 ]; then echo "Inconclusive (exit 2), retrying once"; sleep 20; code=0; run_check || code=$?; fi
          exit "$code"

      - name: HLS check in the snap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: snap run --shell minimalistic-radio -c 'python3 $SNAP/usr/share/minimalistic-radio/check_stream.py'

  # The signed Flatpak repository that testers install from (the .flatpakref) and get their updates from, on GitHub
  # Pages. One branch, stable, for betas and full releases. Runs for a linux-v* tag, and for a manual run on main with
  # publish_repo (publishes, no GitHub release) or dry_run (signs, publishes nothing). Never for a pull request.
  # Only people who can write to the repository can start a manual run.
  repo:
    if: >-
      (startsWith(github.ref, 'refs/tags/linux-v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish_repo || inputs.dry_run))
    needs: [unit, integration, flatpak]
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.sign.outputs.commit }}
    env:
      APP: io.github.zal3wa.minimalistic-radio
      SITE: https://zal3wa.github.io/minimalistic-radio
      PUBLIC_KEY: linux/flatpak/minimalistic-radio.gpg
    steps:
      - uses: actions/checkout@v7

      # Testers get what is published at once, so a tag whose version is wrong stops here, before the release job.
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: |
          full="${GITHUB_REF_NAME#linux-v}"
          version="${full%%-*}"
          code=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' linux/minimalistic_radio/__init__.py)
          meta=$(grep -o '<release version="[^"]*"' linux/data/io.github.zal3wa.minimalistic-radio.metainfo.xml.in | head -n 1 | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME version=$version code=$code metainfo=$meta"
          if [ "$version" != "$code" ] || [ "$version" != "$meta" ]; then
            echo "::error::Tag version $version differs from VERSION ($code) or the newest metainfo release ($meta)"; exit 1
          fi

      - name: Install Flatpak and OSTree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          flatpak --version

      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: flatpak-build-repo
          path: build

      - name: Unpack the build
        run: |
          mkdir build/repo
          tar -xf build/flatpak-build-repo.tar -C build/repo
          ostree refs --repo=build/repo

      # The repository as published now. Its newest version stays (a client may still read the old summary for a
      # few minutes) and gets a static delta to the new one. Nothing published yet (404): a new repository.
      - name: Fetch the published repository
        run: |
          mkdir -p site
          ostree init --repo=site/repo --mode=archive
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/repo/summary")
          echo "Published summary: HTTP $status"
          if [ "$status" = 200 ]; then
            ostree remote add --repo=site/repo --gpg-import="$PUBLIC_KEY" --set=gpg-verify-summary=true published "$SITE/repo/"
            ostree pull --repo=site/repo --mirror published
            ostree remote delete --repo=site/repo published
            rm -f site/repo/*.trustedkeys.gpg
          elif [ "$status" = 404 ]; then
            echo "Nothing is published yet: a new repository."
          else
            echo "::error::Could not read the published repository (HTTP $status)"; exit 1
          fi
          ostree refs --repo=site/repo

      # The private key goes into a keyring of its own in the runner's temporary folder, removed below. It must be
      # the key whose public half is in the repository: that is the one testers trust.
      - name: Import the signing key
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set +x
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$PRIVATE_KEY" | gpg --batch --quiet --import
          public=$(gpg --batch --with-colons --show-keys "$PUBLIC_KEY" | awk -F: '$1 == "fpr" { print $10; exit }')
          secret=$(gpg --batch --with-colons --list-secret-keys "$KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$public" ] || [ "$public" != "$secret" ]; then
            echo "::error::The signing key is missing, or is not the public key in $PUBLIC_KEY"; exit 1
          fi
          echo "The signing key matches $PUBLIC_KEY"

      - name: Add the build to the repository, signed
        id: sign
        env:
          KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set +x
          ref="app/$APP/x86_64/stable"
          flatpak build-commit-from --src-repo=build/repo --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" \
            --no-update-summary site/repo "$ref"
          flatpak build-update-repo --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" \
            --title="Minimalistic Radio" --default-branch=stable --generate-static-deltas site/repo
          commit=$(ostree rev-parse --repo=site/repo "$ref")
          # A signed commit carries its signatures as detached metadata.
          ostree show --repo=site/repo --print-detached-metadata-key=ostree.gpgsigs "$commit" > /dev/null
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          ostree log --repo=site/repo "$ref"
          echo "Signed commit: \`$commit\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key
        if: always()
        run: |
          set +x
          home="$RUNNER_TEMP/gnupg"
          if [ -d "$home" ]; then
            gpgconf --homedir "$home" --kill all || true
            rm -rf "$home"
          fi
          test ! -e "$home"

      # GNOME Software and Discover list the app from this data.
      - name: Check the AppStream data in the repository
        run: |
          ostree ls --repo=site/repo appstream2/x86_64 / || true
          if ostree cat --repo=site/repo appstream2/x86_64 /appstream.xml | grep -q "$APP"; then
            echo "The app is in the repository's AppStream data."
          else
            echo "::warning::The app is missing from the repository's AppStream data"
          fi

      # The release bundle: installing it adds this repository (with its key) as the app's remote, so a bundle
      # install gets updates too. The GNOME runtime comes from Flathub.
      - name: Make the bundle for the release
        run: |
          flatpak build-bundle --arch=x86_64 --repo-url="$SITE/repo/" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo --gpg-keys="$PUBLIC_KEY" \
            site/repo minimalistic-radio.flatpak "$APP" stable
          ls -l minimalistic-radio.flatpak

      - name: Make the install files and the page
        run: |
          key=$(base64 -w0 "$PUBLIC_KEY")
          cat > site/minimalistic-radio.flatpakref <<EOF
          [Flatpak Ref]
          Title=Minimalistic Radio
          Name=$APP
          Branch=stable
          Url=$SITE/repo/
          SuggestRemoteName=minimalistic-radio
          Homepage=https://github.com/zal3wa/minimalistic-radio
          Comment=A tiny internet radio that lives next to the clock
          Icon=$SITE/icon.png
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$key
          EOF
          cat > site/minimalistic-radio.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Minimalistic Radio
          Url=$SITE/repo/
          Homepage=https://github.com/zal3wa/minimalistic-radio
          Comment=The Flatpak repository of Minimalistic Radio
          Icon=$SITE/icon.png
          DefaultBranch=stable
          GPGKey=$key
          EOF
          cp linux/flatpak/site/index.html site/index.html
          cp docs/icon.png site/icon.png
          find site/repo/tmp -mindepth 1 -delete
          cat site/minimalistic-radio.flatpakref site/minimalistic-radio.flatpakrepo
          du -sh site site/repo

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: minimalistic-radio.flatpak
          path: minimalistic-radio.flatpak
          if-no-files-found: error

      - name: Upload the site
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: >-
      (startsWith(github.ref, 'refs/tags/linux-v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.dry_run) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_repo && !inputs.dry_run)
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The published repository, as a tester's computer sees it: a clean Ubuntu with Flatpak from its own packages and
  # no remotes. The GNOME runtime comes from Flathub.
  verify:
    needs: [repo, deploy]
    runs-on: ubuntu-24.04
    env:
      APP: io.github.zal3wa.minimalistic-radio
      SITE: https://zal3wa.github.io/minimalistic-radio
      EXPECTED: ${{ needs.repo.outputs.commit }}
    steps:
      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree xvfb dbus-x11
          # Bubblewrap (the sandbox) needs user namespaces, which Ubuntu limits to programs it knows.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          runtime="$RUNNER_TEMP/xdg-runtime"
          install -d -m 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "FLATPAK_REPO=$HOME/.local/share/flatpak/repo" >> "$GITHUB_ENV"
          flatpak --version

      - name: Wait until GitHub Pages serves the new commit
        run: |
          for attempt in $(seq 60); do
            served=$(curl -sf "$SITE/repo/refs/heads/app/$APP/x86_64/stable" || true)
            if [ "$served" = "$EXPECTED" ]; then echo "Served: $served"; exit 0; fi
            echo "Attempt $attempt: served '${served:-nothing}', expected $EXPECTED"
            sleep 10
          done
          echo "::error::GitHub Pages does not serve commit $EXPECTED"; exit 1

      # What a tester does: one command (or one click on the link in a browser), with no remotes yet.
      - name: Install from the .flatpakref
        run: |
          flatpak install --user --noninteractive --assumeyes "$SITE/minimalistic-radio.flatpakref"
          flatpak remotes --user --show-details
          origin=$(flatpak info --user --show-origin "$APP")
          commit=$(flatpak info --user --show-commit "$APP")
          echo "origin=$origin commit=$commit"
          [ "$origin" = minimalistic-radio ] && [ "$commit" = "$EXPECTED" ]

      - name: Self-test (installed from the .flatpakref)
        run: dbus-run-session -- xvfb-run -a flatpak run "$APP" --self-test

      - name: Add the remote from the .flatpakrepo and install from it
        run: |
          flatpak uninstall --user --noninteractive --assumeyes "$APP"
          flatpak remote-delete --user minimalistic-radio
          flatpak remote-add --user --if-not-exists minimalistic-radio "$SITE/minimalistic-radio.flatpakrepo"
          for key in gpg-verify gpg-verify-summary; do
            value=$(ostree config --repo="$FLATPAK_REPO" get --group='remote "minimalistic-radio"' "$key")
            echo "$key=$value"
            [ "$value" = true ]
          done
          remote=$(flatpak remote-info --user --show-commit minimalistic-radio "$APP//stable")
          echo "remote-info commit: $remote"
          [ "$remote" = "$EXPECTED" ]
          flatpak install --user --noninteractive --assumeyes minimalistic-radio "$APP//stable"
          [ "$(flatpak info --user --show-commit "$APP")" = "$EXPECTED" ]
          ostree show --repo="$FLATPAK_REPO" --gpg-verify-remote=minimalistic-radio "$EXPECTED" | tee show.txt
          grep -q "Good signature" show.txt

      - name: Self-test (installed from the remote)
        run: dbus-run-session -- xvfb-run -a flatpak run "$APP" --self-test

      - name: Download the release bundle
        uses: actions/download-artifact@v7
        with:
          name: minimalistic-radio.flatpak
          path: bundle

      # A bundle install must bring this repository as its remote, so it gets updates as well.
      - name: Install the release bundle, and update from its remote
        run: |
          flatpak uninstall --user --noninteractive --assumeyes "$APP"
          flatpak remote-delete --user minimalistic-radio
          flatpak install --user --noninteractive --assumeyes --bundle bundle/minimalistic-radio.flatpak
          origin=$(flatpak info --user --show-origin "$APP")
          url=$(ostree config --repo="$FLATPAK_REPO" get --group="remote \"$origin\"" url)
          verify=$(ostree config --repo="$FLATPAK_REPO" get --group="remote \"$origin\"" gpg-verify)
          echo "origin=$origin url=$url gpg-verify=$verify"
          [ "$url" = "$SITE/repo/" ] && [ "$verify" = true ]
          [ "$(flatpak remote-info --user --show-commit "$origin" "$APP//stable")" = "$EXPECTED" ]
          flatpak update --user --noninteractive --assumeyes
          [ "$(flatpak info --user --show-commit "$APP")" = "$EXPECTED" ]

  # A release for a linux-v* tag. A manual run with dry_run and a tag does every check and prints the
  # commands instead of running them. Linux releases are never marked latest (that stays with Windows).
  # The .flatpak comes from the repo job (signed, it tracks the repository); the release waits for the
  # repository to be published and checked, which a dry run skips.
  release:
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/linux-v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    needs: [unit, integration, flatpak, snap, repo, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the Flatpak and the Snap
        uses: actions/download-artifact@v7
        with:
          pattern: minimalistic-radio*
          path: release
          merge-multiple: true

      # The one place that reads the tag: the steps below take the version, pre-release and channel from here.
      - name: Check the tag and the artifacts
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then tag="${INPUT_TAG:-$GITHUB_REF_NAME}"; else tag="$GITHUB_REF_NAME"; fi
          if ! [[ "$tag" =~ ^linux-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not a linux-vX.Y.Z or linux-vX.Y.Z-suffix tag"; exit 1
          fi
          full="${tag#linux-v}"
          version="${full%%-*}"   # the pre-release suffix (after the version) is not part of the app version
          if [ "$full" != "$version" ]; then prerelease=true; channel=beta; else prerelease=false; channel=stable; fi

          code=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' linux/minimalistic_radio/__init__.py)
          meta=$(grep -o '<release version="[^"]*"' linux/data/io.github.zal3wa.minimalistic-radio.metainfo.xml.in | head -n 1 | cut -d'"' -f2)
          echo "tag=$tag version=$version code=$code metainfo=$meta prerelease=$prerelease channel=$channel"
          [ "$version" = "$code" ] || { echo "::error::Tag version $version differs from VERSION $code"; exit 1; }
          [ "$version" = "$meta" ] || { echo "::error::Tag version $version differs from the newest metainfo release $meta"; exit 1; }

          ls -l release
          flatpak=release/minimalistic-radio.flatpak
          snap=$(ls release/minimalistic-radio_*_amd64.snap | head -n 1)
          test -s "$flatpak"
          test -s "$snap"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "channel=$channel"
            echo "flatpak=$flatpak"
            echo "snap=$snap"
          } >> "$GITHUB_OUTPUT"

      # Safe to run again ("Re-run failed jobs" after the Snap Store step failed): a release that exists already
      # only gets its files replaced. A dry run runs this same code and prints the command instead.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          FLATPAK: ${{ steps.plan.outputs.flatpak }}
          SNAP: ${{ steps.plan.outputs.snap }}
          REPO_COMMIT: ${{ needs.repo.outputs.commit }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists already: only its files are replaced."
            command=(gh release upload "$TAG" "$FLATPAK" "$SNAP" --clobber)
          else
            command=(gh release create "$TAG" "$FLATPAK" "$SNAP"
                     --title "Minimalistic Radio for Linux $VERSION" --notes-from-tag --latest=false)
            if [ "$PRERELEASE" = true ]; then command+=(--prerelease); fi
          fi
          if [ "$DRY_RUN" = true ]; then
            printed=$(printf '%q ' "${command[@]}")
            echo "DRY RUN (nothing is published). Would run:"
            echo "$printed"
            echo "snapcore/action-publish: snap=$SNAP release=$CHANNEL"
            echo "Flatpak repository: signed commit $REPO_COMMIT, not deployed"
            {
              echo "### Dry run for $TAG"
              echo '```'
              echo "$printed"
              echo "snap publish: $SNAP to the $CHANNEL channel"
              echo "Flatpak repository: signed commit $REPO_COMMIT, not deployed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            "${command[@]}"
          fi

      - name: Check for the Snap Store credentials
        id: store
        if: ${{ !inputs.dry_run }}
        env:
          CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$CREDENTIALS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Snap Store upload skipped: the SNAPCRAFT_STORE_CREDENTIALS secret is not set." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to the Snap Store
        if: ${{ !inputs.dry_run && steps.store.outputs.present == 'true' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.plan.outputs.snap }}
          release: ${{ steps.plan.outputs.channel }}
