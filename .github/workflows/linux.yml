name: Linux

on:
  push:
    branches: ['**']
    tags: ['linux-v*']
    paths: ['linux/**', '.github/workflows/linux.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Does the GNOME Flatpak runtime decode HE-AAC (SBR and PS) from internet radio?
  aac-gate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Install the GNOME runtime
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive --assumeyes flathub org.gnome.Platform//51
          flatpak list --runtime --columns=ref

      - name: Check HE-AAC decoding
        run: >
          flatpak run --share=network --filesystem=$PWD
          --command=python3 org.gnome.Platform//51
          linux/tools/check_aac.py

  # Does the gnome content snap used by the snapcraft gnome extension ship gst-libav?
  snap-gnome-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install the gnome content snap (core26)
        run: sudo snap install gnome-core26

      - name: Look for libgstlibav.so
        run: |
          found=$(find /snap/gnome-core26/current -name libgstlibav.so)
          echo "libgstlibav.so: ${found:-none}"
          if [ -z "$found" ]; then
            echo "AAC: stage gst-libav in the snap" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Pure-Python unit tests (core/, controller.py): no GTK needed.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run the unit tests
        run: cd linux && python -m pytest -q

  # GStreamer playback against a local test server, on the distribution's PyGObject.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install PyGObject, GTK, libadwaita and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-tools xvfb dbus-x11 gettext meson

      - name: List the GStreamer elements the tests rely on
        run: |
          for element in playbin souphttpsrc icydemux pulsesink pipewiresink fakesink lamemp3enc avenc_aac aacparse fdkaacenc opusenc oggmux avdec_aac fdkaacdec; do
            if gst-inspect-1.0 --exists "$element"; then echo "$element: yes"; else echo "$element: no"; fi
          done

      - name: Run the integration tests
        run: cd linux && dbus-run-session -- xvfb-run -a python3 -m pytest tests/integration -q -rs
