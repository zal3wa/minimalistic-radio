name: Linux

on:
  push:
    branches: ['**']
    tags: ['linux-v*']
    paths: ['linux/**', '.github/workflows/linux.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Does the gnome content snap used by the snapcraft gnome extension ship gst-libav?
  snap-gnome-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install the gnome content snap (core26)
        run: sudo snap install gnome-core26

      - name: Look for libgstlibav.so
        run: |
          found=$(find /snap/gnome-core26/current -name libgstlibav.so)
          echo "libgstlibav.so: ${found:-none}"
          if [ -z "$found" ]; then
            echo "AAC: stage gst-libav in the snap" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Pure-Python unit tests (core/, controller.py): no GTK needed.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run the unit tests
        run: cd linux && python -m pytest -q

  # GStreamer playback against a local test server, on the distribution's PyGObject.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install PyGObject, GTK, libadwaita and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-tools gir1.2-gdkpixbuf-2.0 librsvg2-common xvfb dbus-x11 gettext meson desktop-file-utils appstream

      # fdkaacenc makes the HE-AAC test stream. Without it that one case is skipped.
      - name: Install the HE-AAC encoder
        run: sudo apt-get install -y gstreamer1.0-fdkaac || echo "gstreamer1.0-fdkaac is not available"

      - name: List the GStreamer elements the tests rely on
        run: |
          for element in playbin souphttpsrc icydemux pulsesink pipewiresink fakesink lamemp3enc avenc_aac aacparse fdkaacenc opusenc oggmux avdec_aac fdkaacdec; do
            if gst-inspect-1.0 --exists "$element"; then echo "$element: yes"; else echo "$element: no"; fi
          done

      - name: Run the integration tests
        run: cd linux && dbus-run-session -- xvfb-run -a python3 -m pytest tests/integration -q -rs

      - name: Build with Meson and run its checks
        run: |
          meson setup _build linux --prefix "$PWD/_installed"
          meson compile -C _build
          meson test -C _build --print-errorlogs

      # The installed app (as in the Flatpak and the Snap) must have every module: a missing one only fails at run time.
      - name: Install, and check the installed app
        run: |
          meson install -C _build
          package=$(dirname "$(find _installed -path '*/minimalistic_radio/main.py')")
          (cd "$package/.." && find minimalistic_radio -name '*.py' | sort) > installed.txt
          (cd linux && git ls-files 'minimalistic_radio/*.py' | sort) > expected.txt
          diff -u expected.txt installed.txt
          dbus-run-session -- xvfb-run -a _installed/bin/minimalistic-radio --self-test

      # Pictures of the window for review (the owner has no Linux). Never fails the job.
      - name: Take the screenshots
        continue-on-error: true
        run: |
          cd linux
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" python3 -m minimalistic_radio.main --screenshot ../linux-screenshots
          # The installed app has the compiled catalogs: German and Ukrainian show whether the longer words fit.
          for lang in de uk; do
            LANGUAGE=$lang dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" "$PWD/../_installed/bin/minimalistic-radio" --screenshot ../linux-screenshots/$lang
          done

      # linux-screenshots, for the metainfo, comes from the Flatpak job.
      - name: Upload the screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots-ubuntu
          path: linux-screenshots/
          if-no-files-found: ignore

  # The Flatpak: built as Flathub would, checked by Flathub's linter, and run in its sandbox.
  # Each check runs whenever the build worked, so one failure does not hide the others.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      MANIFEST: linux/flatpak/io.github.zal3wa.MinimalisticRadio.yml
    steps:
      - uses: actions/checkout@v7

      - name: Build
        id: build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: linux/flatpak/io.github.zal3wa.MinimalisticRadio.yml
          bundle: minimalistic-radio.flatpak
          artifact-name: minimalistic-radio.flatpak

      # Errors that only this repository's build has (raw output first, then the verdict):
      # - appid-url-not-reachable: the app ID points at github.com/zal3wa/minimalisticradio,
      #   the repository is minimalistic-radio. To be settled with Flathub before submitting.
      # - appstream-external-screenshot-url, appstream-screenshots-not-mirrored-in-ostree: Flathub's
      #   build mirrors the screenshots; this one keeps the GitHub URLs, which a .flatpak from a release can show.
      # - appstream-missing-screenshots: only while the screenshots are not on main yet.
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          allowed='"appid-url-not-reachable", "appstream-external-screenshot-url", "appstream-screenshots-not-mirrored-in-ostree"'
          if ! curl -sfI https://raw.githubusercontent.com/zal3wa/minimalistic-radio/main/docs/screenshots/linux-stations-light.png > /dev/null; then
            echo "::warning::The screenshots are not on main yet."
            allowed="$allowed, \"appstream-missing-screenshots\""
          fi
          echo "{\"io.github.zal3wa.MinimalisticRadio\": [$allowed]}" > /tmp/lint-exceptions.json
          flatpak-builder-lint manifest "$MANIFEST" || true
          flatpak-builder-lint repo repo || true
          flatpak-builder-lint --exceptions --user-exceptions /tmp/lint-exceptions.json manifest "$MANIFEST"
          flatpak-builder-lint --exceptions --user-exceptions /tmp/lint-exceptions.json repo repo

      # flatpak-builder --run: the built app on the SDK, with the manifest's permissions.
      - name: Self-test in the sandbox
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a flatpak-builder --run flatpak_app "$MANIFEST" minimalistic-radio --self-test

      - name: Take the screenshots in the sandbox
        id: shots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$PWD/linux-screenshots"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" flatpak-builder --run --filesystem="$PWD/linux-screenshots" \
            flatpak_app "$MANIFEST" minimalistic-radio --screenshot "$PWD/linux-screenshots"

      - name: Upload the screenshots
        if: ${{ !cancelled() && steps.shots.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots
          path: linux-screenshots/

      - name: HE-AAC check in the sandbox
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a flatpak-builder --run flatpak_app "$MANIFEST" python3 /app/share/minimalistic-radio/check_aac.py

      # The player tests on the runtime's GStreamer, for information only.
      - name: Player tests in the sandbox
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          dbus-run-session -- xvfb-run -a flatpak-builder --run --filesystem="$PWD" flatpak_app "$MANIFEST" \
            sh -c "python3 -m pip install --quiet --target /tmp/pytest pytest && cd '$PWD/linux' && PYTHONPATH=/tmp/pytest python3 -m pytest tests/integration/test_player.py -q -rs -p no:cacheprovider"
