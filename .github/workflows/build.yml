name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: dotnet build src/MinimalisticRadio.csproj -c Release -o out

      - uses: actions/upload-artifact@v7
        with:
          name: Minimalistic-Radio
          path: out/Minimalistic Radio.exe

      # A tag like v2.1.0 publishes a release; the radio's update check reads the latest one.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "out/Minimalistic Radio.exe" "Minimalistic-Radio.exe"
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME "Minimalistic-Radio.exe" --title "Minimalistic Radio $version" --notes-from-tag
